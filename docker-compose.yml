# Local. The API runs on the host, so datastores bind to 127.0.0.1 only.
# They are not reachable from the LAN. On a VPS use docker-compose.vps.yml.
#
# Viewers (also loopback):
#   Adminer       http://127.0.0.1:8080   System PostgreSQL, server postgres,
#                                  user/password/db from DATABASE_*
#   pgAdmin       http://127.0.0.1:5050   admin@example.com / PGADMIN_PASSWORD
#                                  database indiefast is already added
#   RedisInsight  http://127.0.0.1:5540   database indiefast is already added

name: indiefast

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
  redisinsight_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-indiefast}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-indiefast}
      POSTGRES_DB: ${DATABASE_NAME:-indiefast}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-indiefast}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-indiefast}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-indiefast}
      - --stop-writes-on-bgsave-error
      - "no"
    volumes:
      - ./docker/redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-indiefast}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-indiefastindiefast}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./docker/minio_data:/data
    networks:
      - internal

  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - internal

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    entrypoint: ["/bin/sh", "/pgadmin-entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-indiefast}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      DATABASE_USER: ${DATABASE_USER:-indiefast}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-indiefast}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - ./docker/pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/entrypoint.sh:/pgadmin-entrypoint.sh:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:2.70
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: indiefast
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-indiefast}
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - ./docker/redisinsight_data:/data
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
