# VPS. Databases, MinIO, and Mailpit publish no host ports.
# Other containers reach them on the internal network:
#   postgres:5432  redis:6379  minio:9000  mailpit:1025
#
# Viewers bind to 127.0.0.1 on the VPS only. Open them through SSH:
#   ssh -L 8080:127.0.0.1:8080 -L 5050:127.0.0.1:5050 -L 5540:127.0.0.1:5540 user@vps
#   Adminer       http://127.0.0.1:8080  System PostgreSQL, server postgres
#   pgAdmin       http://127.0.0.1:5050  (database indiefast is already added)
#   RedisInsight  http://127.0.0.1:5540  (database indiefast is already added)
#
# docker compose -f docker-compose.vps.yml up -d

name: indiefast

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pgadmin_data:
  redisinsight_data:

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-indiefast}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-indiefast}
      POSTGRES_DB: ${DATABASE_NAME:-indiefast}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-indiefast}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-indiefast}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-indiefast}
      - --stop-writes-on-bgsave-error
      - "no"
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-indiefast}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-indiefastindiefast}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_URL:-http://localhost:3000}
    volumes:
      - minio_data:/data
    networks:
      - internal

  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      - internal

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    entrypoint: ["/bin/sh", "/pgadmin-entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-indiefast}
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      DATABASE_USER: ${DATABASE_USER:-indiefast}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-indiefast}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/entrypoint.sh:/pgadmin-entrypoint.sh:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:2.70
    environment:
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: indiefast
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD:-indiefast}
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
