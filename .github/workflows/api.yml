name: api

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: indiefast
          POSTGRES_PASSWORD: indiefast
          POSTGRES_DB: indiefast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indiefast -d indiefast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        command: redis-server --requirepass indiefast --stop-writes-on-bgsave-error no
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a indiefast ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: quay.io/minio/minio
        command: server /data
        env:
          MINIO_ROOT_USER: indiefast
          MINIO_ROOT_PASSWORD: indiefastindiefast
          MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      - run: pnpm --filter api db:migrate
      - run: pnpm --filter api test
      - run: pnpm --filter api lint
      - run: pnpm --filter api check-types
